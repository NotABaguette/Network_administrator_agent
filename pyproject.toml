[project]
name = "infra-agent"
version = "0.1.0"
description = "AI-driven administrator for a bare-metal ESXi / FortiGate / Catalyst estate"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "requests>=2.32",
    "prometheus-client>=0.20",
    "apscheduler>=3.10,<4",
    "networkx>=3.3",
]

[project.optional-dependencies]
devices = [
    "scrapli[paramiko]>=2024.1.30",
    "ntc-templates>=5.0",
    "pyvmomi>=8.0",
    "redfish>=3.2",
]
platform = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pynetbox==7.4.1",
]
agent = [
    "anthropic>=0.40",
    "fastmcp>=2.0",
    "python-telegram-bot>=21.0",
]
all = ["infra-agent[devices,platform,agent]"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
infra = "infra_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infra_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # typer.Option in defaults is the typer idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
