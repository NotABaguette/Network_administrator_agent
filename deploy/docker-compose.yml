# Platform stack for mgmt-01. Copy .env.example to .env first.
name: infra

x-infra-image: &infra-image
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  env_file: .env
  volumes:
    - ../inventory:/app/inventory:ro
    - ../secrets:/app/secrets:ro
    - ${SOPS_AGE_KEY_FILE:-~/.config/sops/age/keys.txt}:/root/.config/sops/age/keys.txt:ro
    - infra-data:/app/data
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-infra}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infra}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  netbox:
    image: netboxcommunity/netbox:v4.3-3.3.0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      DB_HOST: postgres
      DB_NAME: netbox
      DB_USER: ${POSTGRES_USER:-infra}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_CACHE_HOST: redis
      SECRET_KEY: ${NETBOX_SECRET_KEY}
      SUPERUSER_NAME: ${NETBOX_SUPERUSER:-admin}
      SUPERUSER_PASSWORD: ${NETBOX_SUPERUSER_PASSWORD}
      SUPERUSER_API_TOKEN: ${NETBOX_API_TOKEN}
      ALLOWED_HOSTS: "*"
      SKIP_SUPERUSER: "false"
    ports: ["127.0.0.1:8000:8080"]
    volumes:
      - netbox-media:/opt/netbox/netbox/media
    restart: unless-stopped

  netbox-worker:
    image: netboxcommunity/netbox:v4.3-3.3.0
    depends_on: [netbox]
    command: ["/opt/netbox/venv/bin/python", "/opt/netbox/netbox/manage.py", "rqworker"]
    environment:
      DB_HOST: postgres
      DB_NAME: netbox
      DB_USER: ${POSTGRES_USER:-infra}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_CACHE_HOST: redis
      SECRET_KEY: ${NETBOX_SECRET_KEY}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=180d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - ../infra_agent/monitoring/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.4.2
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "514:514/udp"
      - "514:514/tcp"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped

  snmp-exporter:
    image: prom/snmp-exporter:v0.26.0
    command: ["--config.file=/etc/snmp_exporter/snmp.yml"]
    volumes:
      - ./snmp:/etc/snmp_exporter:ro
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    restart: unless-stopped

  infra-collectors:
    <<: *infra-image
    command: ["infra", "collect", "--loop"]
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:9101:9101"]

  infra-agent:
    <<: *infra-image
    command: ["infra", "agent", "run"]
    depends_on: [infra-collectors, alertmanager]
    ports: ["127.0.0.1:9102:9102"]

  infra-mcp:
    <<: *infra-image
    command: ["infra", "mcp", "serve", "--host", "0.0.0.0", "--port", "8765"]
    depends_on: [infra-collectors]
    ports: ["127.0.0.1:8765:8765"]

volumes:
  postgres-data:
  netbox-media:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  grafana-data:
  infra-data:
