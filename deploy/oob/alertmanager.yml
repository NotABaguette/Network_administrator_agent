# Out-of-band Alertmanager.
#
# Clustered with the main one (see --cluster.peer in docker-compose.yml), so
# silences and de-duplication are shared while both are up. The receiver is
# NOT the agent: the whole point of this box is that it works when the agent is
# gone, so it talks straight to the owner's Telegram chat.
#
# `group_by: [alertname]` without `vantage` on purpose: an alert seen from both
# vantages is one problem, and the owner should get one message about it.
global:
  resolve_timeout: 5m

templates: []

route:
  receiver: owner-telegram
  group_by: [alertname, instance]
  group_wait: 20s
  group_interval: 5m
  # More often than the main stack's 4h. If this box is alerting at all, the
  # normal channel is probably not working.
  repeat_interval: 1h
  routes:
    # The site is dark. Say it once, immediately, and keep saying it.
    - matchers: [alertname="WanDown"]
      receiver: owner-telegram
      group_wait: 0s
      repeat_interval: 30m

receivers:
  - name: owner-telegram
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_token
        chat_id: ${TELEGRAM_CHAT_ID}
        api_url: https://api.telegram.org
        parse_mode: HTML
        send_resolved: true
        message: |
          <b>[OOB] {{ .Status | toUpper }} {{ .CommonLabels.alertname }}</b>
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
          Raised from the out-of-band box, which does not depend on mgmt-01.

inhibit_rules:
  # A dark site explains everything else on this box. One message, not twelve.
  - source_matchers: [alertname="WanDown"]
    target_matchers: [severity=~"warning|critical"]
    equal: [vantage]

  # A dead firewall explains every device behind it.
  - source_matchers: [alertname="FirewallDownOOB"]
    target_matchers: [alertname=~"SwitchDownOOB|EsxiHostDownOOB|MgmtVmUnreachable"]
    equal: [vantage]

  # If the VM is not on the network, of course its health endpoint is silent.
  - source_matchers: [alertname="MgmtVmUnreachable"]
    target_matchers: [alertname=~"MgmtVmDown|PrimaryAlertmanagerDown"]
    equal: [vantage]
