global:
  scrape_interval: 60s
  evaluation_interval: 60s

rule_files:
  - /etc/prometheus/rules/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  # The collectors expose everything about FortiGate, ESXi and iLO themselves.
  - job_name: infra-collectors
    static_configs: [{ targets: ["infra-collectors:9101"] }]

  - job_name: infra-agent
    static_configs: [{ targets: ["infra-agent:9102"] }]

  # Catalyst switches via snmp_exporter. Targets come from file_sd, written by
  # `infra collect` from the seed inventory / NetBox.
  - job_name: cisco-snmp
    scrape_interval: 60s
    metrics_path: /snmp
    params:
      module: [if_mib, cisco_wlc]
      auth: [cisco_v3]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/cisco.json"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  # Guest operating systems: node_exporter (9100) and windows_exporter (9182),
  # installed by ansible/playbooks/. Targets come from file_sd, written by
  # `infra onboard seed-guests` from the seed inventory; the guest collector
  # itself reports through infra-collectors above.
  - job_name: guests
    scrape_interval: 60s
    file_sd_configs:
      - files: ["/etc/prometheus/targets/guests.json"]

  # WAN and service probes.
  - job_name: blackbox-icmp
    metrics_path: /probe
    params: { module: [icmp] }
    file_sd_configs:
      - files: ["/etc/prometheus/targets/icmp.json"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Out-of-band box heartbeat (deploy/oob). Scraped from the MAIN side on purpose:
  # the alert must keep speaking when the OOB box goes quiet. Inert until
  # targets/oob.json names the box, e.g. [{"targets":["10.0.0.9:9105"],"labels":{"vantage":"oob"}}]
  - job_name: oob-heartbeat
    scrape_interval: 60s
    scrape_timeout: 10s
    file_sd_configs:
      - files: ["/etc/prometheus/targets/oob.json"]

  - job_name: blackbox-https
    metrics_path: /probe
    params: { module: [https_2xx] }
    file_sd_configs:
      - files: ["/etc/prometheus/targets/https.json"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
