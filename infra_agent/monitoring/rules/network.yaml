groups:
  - name: infra-network
    rules:
      - alert: DeviceUnreachable
        expr: up{job=~"cisco-snmp|blackbox-icmp"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} is not answering"
      - alert: WanGatewayDown
        expr: probe_success{job="blackbox-icmp", role="wan-gateway"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "WAN gateway {{ $labels.instance }} unreachable"
      - alert: SwitchUplinkDown
        expr: ifOperStatus{role="uplink"} != 1
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Uplink {{ $labels.ifName }} on {{ $labels.instance }} is down"
      - alert: InterfaceErrors
        expr: rate(ifInErrors[5m]) + rate(ifOutErrors[5m]) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.ifName }} on {{ $labels.instance }} shows errors"
